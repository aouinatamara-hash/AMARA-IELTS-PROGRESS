Sub CopyDataToMaster()
    Dim wsSource As Worksheet
    Dim wsMaster As Worksheet
    Dim lastRowSource As Long
    Dim lastRowMaster As Long
    
    ' إيقاف تحديث الشاشة لسرعة التنفيذ
    Application.ScreenUpdating = False
    
    ' تعيين شيت المصدر (قم بتغيير Sheet1 باسم الشيت الخاص بك)
    Set wsSource = ThisWorkbook.Sheets("Sheet1")
    
    ' تعيين الشيت الرئيسي للتجميع (قم بتغيير MasterSheet باسم الشيت النهائي)
    Set wsMaster = ThisWorkbook.Sheets("MasterSheet")
    
    ' معرفة آخر صف يحتوي على بيانات في شيت المصدر (العمود A)
    lastRowSource = wsSource.Cells(wsSource.Rows.Count, "A").End(xlUp).Row
    
    ' معرفة آخر صف فارغ في الشيت الرئيسي (العمود A)
    lastRowMaster = wsMaster.Cells(wsMaster.Rows.Count, "A").End(xlUp).Row + 1
    
    ' التحقق من وجود بيانات للنسخ
    If lastRowSource >= 2 Then
        ' نسخ البيانات من الصف 2 حتى آخر صف إلى الشيت الرئيسي
        wsSource.Range("A2:Z" & lastRowSource).Copy Destination:=wsMaster.Range("A" & lastRowMaster)
        MsgBox "تم نسخ البيانات بنجاح!", vbInformation, "نجاح"
    Else
        MsgBox "لا توجد بيانات جديدة للنسخ.", vbExclamation, "تنبيه"
    End If
    
    ' إعادة تفعيل تحديث الشاشة
    Application.ScreenUpdating = True
End Sub
